name: ci

# Build + test verification on every branch / PR. Does NOT publish — releases
# go through kotlin-compose-publish.yml on a kotlin-compose-v* tag.
on:
  push:
    branches:
      - '**'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up JDK 17
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4

      - name: Cache Gradle
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', 'gradle/libs.versions.toml') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      # Pure-Kotlin modules: full multiplatform build + all tests. The engine's
      # bit-exact parity tests (bucketing, k-means) and the schema round-trips
      # run on every target here.
      - name: Build schema (all targets)
        run: ./gradlew :kotlin-compose-schema:build

      - name: Build engine (all targets)
        run: ./gradlew :kotlin-engine:build

      # Runs the factor-SQL integration test against a throwaway Postgres
      # (testcontainers); Docker is available on ubuntu runners.
      - name: Build kotlin-server
        run: ./gradlew :kotlin-server:build

      - name: Build capture (all targets)
        run: ./gradlew :kotlin-compose-capture:build

      # The whole suite, same as the publish job: the render-correctness gate lives inside it, and
      # the desktopTest floor fails any --tests filter that narrows the run.
      - name: Run renderer desktop tests
        run: ./gradlew :kotlin-compose:desktopTest

      - name: Assemble renderer (all targets)
        run: ./gradlew :kotlin-compose:assemble
